	<script type="text/javascript">
		/// some script

		$(document).ready(function () {
			// jQuery code

		});
		// jquery end
	</script>

	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
	<link href="{% static 'css/custom.css'%}" rel="stylesheet" type="text/css" />
	<style>
		/* Hide Radio button */
		.rate>input {
			display: none;
		}

		.rate {
			display: inline-block;
			;
			border: 0;
		}

		.rate>label {
			float: right;
		}

		/* Showing the stars */
		.rate>label:before {
			display: inline-block;
			font-size: 1.1rem;
			font-family: FontAwesome;
			content: "\f005";
			margin: 0;
			padding: 0.3rem .2rem;
			cursor: pointer;
		}

		/* Half star */
		.rate .half:before {
			content: "\f089";
			position: absolute;
			padding-right: 0;
		}

		/* Click and hover */
		input:checked~label,
		label:hover~label {
			color: #ffb503;
		}

		/* hover hightlight */
		input:checked+label:hover,
		input:checked~label:hover,
		input:checked~label:hover~label,
		label:hover~input:checked~label {
			color: #cc9000;
		}

		.rating-star i {
			color: #ffb503 !important;
		}

		ul.thumb {
			margin: 0 auto;
			padding: 0;
			float: left;
		}
		
		ul.thumb li {
			display: inline-block;
			list-style: none;
			margin: 5px;
		}

		ul.thumb li img {
			width: 80px;
			height: 80px;
			border: 1px solid grey;
		}
	</style>


</head>

</html>
